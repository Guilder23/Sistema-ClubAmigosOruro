{% extends 'base/base.html' %}
{% block contenido %}
<div class="container">
  <h2>Administrador: {{ user_obj.username }}</h2>
  <p><strong>Nombre:</strong> {{ user_obj.get_full_name }}</p>
  <p><strong>Email:</strong> {{ user_obj.email }}</p>
  <a href="{% url 'socios:listar_admins' %}" class="btn btn-secondary">Volver</a>
</div>
{% endblock %}

{% block estilos_extra %}
<link rel="stylesheet" href="{% static 'css/admins/ver_admin.css' %}">
{% endblock %}

{% block scripts_extra %}
<script src="{% static 'js/admins/ver_admin.js' %}"></script>
{% endblock %}
