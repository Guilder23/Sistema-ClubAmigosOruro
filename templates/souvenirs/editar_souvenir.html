{% extends 'base/base.html' %}
{% load static %}

{% block titulo %}Editar Souvenir{% endblock %}

{% block estilos_extra %}
<link rel="stylesheet" href="{% static 'css/souvenirs/editar_souvenir.css' %}">
{% endblock %}

{% block contenido %}
<div class="container py-4">
    <div class="card card-body souvenir-form-card">
        <h2 class="mb-3">Editar souvenir</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" name="nombre" class="form-control" value="{{ souvenir.nombre }}" required>
            </div>
            <div class="form-group">
                <label>Descripción</label>
                <textarea name="descripcion" class="form-control" rows="3">{{ souvenir.descripcion }}</textarea>
            </div>
            <div class="form-row">
                <div class="col-md-6 form-group">
                    <label>Stock</label>
                    <input type="number" name="stock" class="form-control" value="{{ souvenir.stock }}" min="0">
                </div>
                <div class="col-md-6 form-group">
                    <label>Imagen</label>
                    <input type="file" name="imagen" class="form-control-file" accept="image/*">
                </div>
            </div>
            <div class="btn-group mt-3" role="group">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="{% url 'souvenirs:listar_souvenirs' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts_extra %}
<script src="{% static 'js/souvenirs/editar_souvenir.js' %}"></script>
{% endblock %}
